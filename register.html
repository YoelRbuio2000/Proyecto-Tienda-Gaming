<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Aeternum Tech</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header-tech">
        <div class="nav-links">
            <a href="index.html" class="btn-registro">INICIO</a>
            <a href="tienda.html">TIENDA</a>
        </div>
        <div class="nav-links-right">
            <a href="login.html">INICIAR SESIÓN</a>
        </div>
    </header>

    <div class="auth-container">
        <h1>Crear cuenta</h1>
        <div id="mensaje" class="mensaje"></div>

        <form id="form-register">
            <input type="text" id="nombre" placeholder="Nombre completo" required>
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required minlength="4">
            <input type="password" id="password2" placeholder="Repetir contraseña" required>
            <button type="submit">Registrarse</button>
        </form>

        <p class="auth-link">
            ¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
